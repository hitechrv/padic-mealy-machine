name: Deploy to GitHub Pages

# Deploy on pushes to main and to the active feature branch so the live
# URL stays up-to-date throughout development. Also allow manual runs
# via the Actions UI for hotfixes and re-deploys.
on:
  push:
    branches:
      - main
      - claude/setup-game-mobile-a2nfv
  workflow_dispatch:

# Only one deploy at a time; newer pushes cancel older in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Derive base from the repo name so the build works for any fork
          # (or if this repo is ever renamed) without editing the workflow.
          BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
